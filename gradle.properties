kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 makes 'com.android.application'/'com.android.library' incompatible with the Kotlin
# Multiplatform plugin by default. There is no KMP-native replacement for 'com.android.application'
# yet (only 'com.android.kotlin.multiplatform.library' exists for library modules), so opt back
# into the legacy DSL until Google ships one.
android.builtInKotlin=false
android.newDsl=false

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
